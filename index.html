<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#132030;--muted:#5a6b7e;--line:#d9e2ec;--brand:#7f0a1f;--chip:#f3f6fa;--kid:#fff8e6;--kidink:#3d2a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c131b;--card:#15202b;--ink:#e6edf5;--muted:#9bacbf;--line:#253242;--chip:#1b2836;--kid:#2a2310;--kidink:#ffe6a6}}
:root[data-theme="dark"]{--bg:#0c131b;--card:#15202b;--ink:#e6edf5;--muted:#9bacbf;--line:#253242;--chip:#1b2836;--kid:#2a2310;--kidink:#ffe6a6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--brand);padding-bottom:8px}

<script>
(()=>{
'use strict';
// ===== math =====
const PI=Math.PI,TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
const ramp=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const smooth=k=>{k=clamp(k,0,1);return k*k*(3-2*k);};
const easeOut=k=>1-Math.pow(1-clamp(k,0,1),2);
const backOut=k=>{k=clamp(k,0,1);const c=1.7;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};
const L2=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k)];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const mul=(a,k)=>[a[0]*k,a[1]*k];
const norm=a=>{const l=Math.hypot(a[0],a[1])||1;return [a[0]/l,a[1]/l];};
const ang=a=>Math.atan2(a[1],a[0]);
const dirA=t=>[Math.cos(t),Math.sin(t)];
const hump=(d,w)=>{const k=d/w;return k*k<1?1-k*k:0;};
function angLerp(a,b,k){const d=((b-a+PI)%TAU+TAU)%TAU-PI;return a+d*k;}

// ===== tracks =====
// keyframes [[t,x,z],...] -> t=>[x,z] (cubic hermite, stops are smooth)
function kf(keys){
  const n=keys.length;
  const m=keys.map((k,i)=>{
    if(i===0||i===n-1)return[0,0];
    const a=keys[i-1],b=keys[i+1];
    if((a[1]===k[1]&&a[2]===k[2])||(b[1]===k[1]&&b[2]===k[2]))return[0,0];
    const dt=b[0]-a[0];return[(b[1]-a[1])/dt,(b[2]-a[2])/dt];
  });
  return t=>{
    if(t<=keys[0][0])return[keys[0][1],keys[0][2]];
    if(t>=keys[n-1][0])return[keys[n-1][1],keys[n-1][2]];
    let i=0;while(i<n-2&&t>keys[i+1][0])i++;
    const a=keys[i],b=keys[i+1],h=b[0]-a[0],u=(t-a[0])/h,u2=u*u,u3=u2*u;
    const h00=2*u3-3*u2+1,h10=u3-2*u2+u,h01=-2*u3+3*u2,h11=u3-u2;
    return[h00*a[1]+h10*h*m[i][0]+h01*b[1]+h11*h*m[i+1][0],h00*a[2]+h10*h*m[i][1]+h01*b[2]+h11*h*m[i+1][1]];
  };
}
// constant-speed polyline (slower in arcs, accelerates from start)
function polyPath(pts,t0,v,noAcc){
  const T=[t0];let dist=0;
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],L=Math.hypot(b.x-a.x,b.z-a.z);
    const sp=v*(b.arc?0.72:1)*(noAcc?1:Math.min(1,0.35+0.65*dist/14));
    T.push(T[i-1]+L/sp);dist+=L;
  }
  const at=t=>{
    const n=pts.length;
    if(t<=T[0])return{x:pts[0].x,z:pts[0].z,tgt:pts[1]&&pts[1].tgt};
    if(t>=T[n-1])return{x:pts[n-1].x,z:pts[n-1].z,tgt:pts[n-1].tgt,done:1};
    let i=1;while(T[i]<t)i++;
    const u=(t-T[i-1])/(T[i]-T[i-1]),a=pts[i-1],b=pts[i];
    return{x:lerp(a.x,b.x,u),z:lerp(a.z,b.z,u),arc:!!b.arc,tgt:b.tgt};
  };
  return{at,T,tEnd:T[T.length-1],pts};
}
// tight turn around cone C coming from P, leaving toward N
function turnAround(P,C,N,r){
  let best=null;
  for(const s of[1,-1]){
    const d=norm(sub(C,P)),n=[-d[1]*s,d[0]*s],w=-s;let th=ang(n);const pts=[];let k=0;
    for(;k<=340;k+=12){
      const a=th+w*k*PI/180,Q=[C[0]+r*Math.cos(a),C[1]+r*Math.sin(a)];
      pts.push(Q);
      const tg=[w*-Math.sin(a),w*Math.cos(a)],toN=norm(sub(N,Q));
      if(k>=168&&tg[0]*toN[0]+tg[1]*toN[1]>0.9)break;
    }
    if(!best||k<best.k)best={k,pts};
  }
  return best.pts;
}
function racePath(start,cones,end,r){
  const pts=[{x:start[0],z:start[1]}],ts=[],te=[];let P=start;
  cones.forEach((C,i)=>{
    const N=i<cones.length-1?cones[i+1]:end,arc=turnAround(P,C,N,r);
    ts.push(pts.length);
    arc.forEach((q,j)=>pts.push({x:q[0],z:q[1],arc:j>0,tgt:j===0?C:N}));
    te.push(pts.length-1);P=arc[arc.length-1];
  });
  pts.push({x:end[0],z:end[1],tgt:end});
  return{pts,ts,te};
}

// dense path follower with per-point attributes (v = speed into point, bk = backward skating 0/1)
function PB(x,z){const pts=[{x,z,v:1}];const o={
  to(x2,z2,v,at){const p=pts[pts.length-1],L=Math.hypot(x2-p.x,z2-p.z),n=Math.max(1,Math.ceil(L/0.8));
    for(let i=1;i<=n;i++)pts.push(Object.assign({x:lerp(p.x,x2,i/n),z:lerp(p.z,z2,i/n),v},at||{}));return o;},
  arc(cx,cz,r,a0,a1,v,at){const n=Math.max(2,Math.ceil(Math.abs(a1-a0)*r/0.8));
    for(let i=1;i<=n;i++){const a=lerp(a0,a1,i/n);pts.push(Object.assign({x:cx+r*Math.cos(a),z:cz+r*Math.sin(a),v},at||{}));}return o;},
  mark(m){pts[pts.length-1].mark=m;return o;},pts};return o;}
function course(pts,t0){
  const n=pts.length,T=[t0],S=[0];
  for(let i=1;i<n;i++){const L=Math.hypot(pts[i].x-pts[i-1].x,pts[i].z-pts[i-1].z);S.push(S[i-1]+L);T.push(T[i-1]+L/(pts[i].v||10));}
  const W=1.8,B=new Array(n);
  for(let i=0;i<n;i++){let a=0,c=0;for(let j=Math.max(0,i-70);j<Math.min(n,i+71);j++)if(Math.abs(S[j]-S[i])<=W){a+=pts[j].bk||0;c++;}B[i]=a/c;}
  const marks={};pts.forEach((p,i)=>{if(p.mark&&marks[p.mark]==null)marks[p.mark]=T[i];});
  const at=t=>{
    if(t<=T[0])return{x:pts[0].x,z:pts[0].z,b:B[0],p:pts[0],pre:1};
    if(t>=T[n-1])return{x:pts[n-1].x,z:pts[n-1].z,b:B[n-1],p:pts[n-1],done:1};
    let a=0,b=n-1;while(b-a>1){const m=(a+b)>>1;if(T[m]<=t)a=m;else b=m;}
    const u=(t-T[a])/(T[b]-T[a]);
    return{x:lerp(pts[a].x,pts[b].x,u),z:lerp(pts[a].z,pts[b].z,u),b:lerp(B[a],B[b],u),p:pts[b]};
  };
  return{at,T,marks,tEnd:T[n-1],pts};
}

// ===== actors =====
let CUR=null;
function evalActor(d,t){
  const s=Object.assign({},d.fn(t));
  s.team=s.team||d.team;s.id=d.id;
  if(s.hidden)return s;
  if(s.face==null||s.speed==null){
    const a=d.fn(t-0.12),b=d.fn(t+0.12),vx=b.x-a.x,vz=b.z-a.z,sp=Math.hypot(vx,vz)/0.24;
    if(s.speed==null)s.speed=sp;
    if(s.face==null){
      const bk=s.backness!=null?s.backness:(s.back?1:0),fm=sp>0.3?Math.atan2(vz,vx)+PI*bk:null;
      if(s.lookAt){const fl=Math.atan2(s.lookAt[1]-s.z,s.lookAt[0]-s.x);s.face=fm==null?fl:angLerp(fm,fl,1-smooth(ramp(sp,0.5,3.5)));}
      else if(fm!=null)s.face=fm;
      else{let f=null;for(let k=1;k<=10&&f==null;k++){const q=d.fn(t-0.3*k);if(Math.hypot(s.x-q.x,s.z-q.z)>0.5)f=Math.atan2(s.z-q.z,s.x-q.x)+PI*(q.backness!=null?q.backness:(q.back?1:0));}s.face=f==null?(d.face0||0):f;}
    }
  }
  return s;
}
const bodyScale=s=>s.team==='coach'?1.55:1.3;
function crouchOf(s){if(s.pose==='goalie')return 0.6;const c=s.crouch!=null?s.crouch:(s.team==='coach'?0.12:0.45);return Math.max(c,0.75*(s.hk||0));}
function frame(s){
  const S=bodyScale(s),fx=Math.cos(s.face||0),fz=Math.sin(s.face||0),ly=s.lift||0;
  return{S,P:(fw,sd,up)=>[s.x+(fx*fw-fz*sd)*S,up*S+ly,s.z+(fz*fw+fx*sd)*S]};
}
function stickGeom(s,t){
  const{P}=frame(s),c=crouchOf(s);let bfw=1.95+0.45*c,bsd=-0.3,by=0.1,pl=null,thF=0.38*(s.handsOut||0),thU=0;
  const d=s.dribble;
  if(d){
    const w=d.w==null?1:d.w,ph=(t-(d.t0||0))*(d.speed||5)+(s.seed||0)*0.9;
    if(d.mode==='front')bsd+=Math.sin(ph)*d.amp*w;
    else if(d.mode==='side'){bsd+=d.side*1.25*w+Math.sin(ph)*0.4*w;bfw-=0.25*w;}
    else if(d.mode==='push')bfw+=Math.sin(ph)*0.8*w;
    else if(d.mode==='carry')bsd+=Math.sin(ph)*0.3;
    else if(d.mode==='offset'){bfw+=d.fw||0;bsd+=d.sd||0;}
    else if(d.mode==='kick'){
      const u=(((t-d.t0)*0.42+(s.seed||0)*0.07)%1+1)%1,sk=[0.55,-0.5],b0=bfw;
      if(u<0.35){const k=smooth(u/0.35);bfw=lerp(b0,1.05,k);bsd=lerp(-0.3,-0.75,k);}
      else if(u<0.5){const k=smooth((u-0.35)/0.15);bfw=lerp(1.05,1.6,k);bsd=lerp(-0.75,-0.2,k);pl=sk;}
      else if(u<0.72){const k=smooth((u-0.5)/0.22);bfw=lerp(1.6,b0,k);bsd=lerp(-0.2,-0.3,k);pl=[lerp(sk[0],bfw+0.42,k),lerp(sk[1],bsd-0.32,k)];}
    }
  }
  if(s.shot!=null){
    // wrist shot: load back (0-.3), sweep heel->toe (.3-.62, release), follow through (.62-1), hold (1-1.5), relax (1.5-2)
    const u=clamp(s.shot,0,2),b0=[bfw,bsd,by],ft=[3.15,-0.12,1.35];
    const K=[[0,b0],[0.3,[0.9,-1.2,0.1]],[0.62,[2.65,-0.62,0.1]],[1,ft],[1.5,ft],[2,b0]];
    let i=0;while(i<K.length-2&&u>K[i+1][0])i++;
    const k=smooth(ramp(u,K[i][0],K[i+1][0])),A=K[i][1],B=K[i+1][1];
    bfw=lerp(A[0],B[0],k);bsd=lerp(A[1],B[1],k);by=lerp(A[2],B[2],k);
    const rl=1-smooth(ramp(u,1.5,2));
    thF+=(-0.35*smooth(ramp(u,0.3,0.62))*(1-smooth(ramp(u,0.62,1)))+0.3*smooth(ramp(u,0.62,1)))*rl;thU+=0.55*smooth(ramp(u,0.62,1))*rl;
    if(u<0.7){const r=smooth(ramp(u,0.3,0.62));pl=[bfw+0.42+0.12*r,bsd-0.28-0.5*r];}
  }
  pl=pl||[bfw+0.42,bsd-0.32];
  const pw=P(pl[0],pl[1],0);
  return{heel:[bfw,bsd],toe:[bfw+0.25,bsd-0.7],by,thF,thU,puck:[pw[0],pw[2]]};
}
function carryPos(id,t){return stickGeom(evalActor(CUR.byId[id],t),t).puck;}
function res(ref,t){return typeof ref==='string'?carryPos(ref,t):typeof ref==='function'?ref(t):ref;}
function alongPts(pts,u){
  let tot=0;const L=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);L.push(l);tot+=l;}
  let d=u*tot;for(let i=0;i<L.length;i++){if(d<=L[i]||i===L.length-1)return L2(pts[i],pts[i+1],L[i]?clamp(d/L[i],0,1):1);d-=L[i];}
  return pts[pts.length-1];
}

function kp(id,team,keys,extra){const k=kf(keys);return{id,team,fn:t=>{const p=k(t),s={x:p[0],z:p[1]};const e=extra&&extra(t,p);return e?Object.assign(s,e):s;}};}
function camSeq(keys){return t=>{
  if(t<=keys[0][0])return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];if(t<=b[0]){const k=smooth(ramp(t,a[0],b[0])),A=a[1],B=b[1];
    return{target:[0,1,2].map(j=>lerp(A.target[j],B.target[j],k)),yaw:lerp(A.yaw,B.yaw,k),pitch:lerp(A.pitch,B.pitch,k),dist:lerp(A.dist,B.dist,k)};}}
  return keys[keys.length-1][1];};}

function shotU(t,ts,dur,hold){hold=hold||1;if(t<ts)return null;if(t<=ts+dur)return(t-ts)/dur;const v=1+(t-ts-dur)/hold;return v<=2?v:null;}

      {t0:20,t1:25,rate:0.5,title:'Back leg, front leg, point!',text:'Lean on your back leg, then push onto your front leg as you shoot. Finish by pointing your stick at the target. Keep it low, no pancake flips!',coach:'Weight transfer from back leg to front leg; follow through toward the target. Practice shooting without flipping.'},
      {t0:25,t1:31,title:'Skate and shoot',text:'Now skate and shoot! Keep the puck in your box and shift your weight while you glide.',coach:'Progression #2, shooting while skating: puck in the shooting box while moving weight from back leg to front leg.'},
      {t0:31,t1:38,title:'Catch a pass, then shoot',text:'Show your stick as a target. “Tap tap!” Catch the pass, then shoot fast!',coach:'Progression #3, shooting after receiving a pass: give a proper target. Variation: add obstacles to skate around before the shot.'}]};
}

// ===== render =====
function pushObj(objs,x,y,z,fn){const c=toCam(x,y,z);if(c[2]<NEAR)return;objs.push({d:c[2],fn});}
function bubble(x,y,text,col){
  ctx.font='700 12.5px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  const w=ctx.measureText(text).width+14,h=22,bx=clamp(x-w/2,4,W-w-4),by=clamp(y-h-8,4,H-h-4),tx=clamp(x,bx+9,bx+w-9);
  rr(bx,by,w,h,9);ctx.fillStyle='rgba(255,255,255,.96)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=col;ctx.stroke();
  ctx.beginPath();ctx.moveTo(tx-5,by+h-1);ctx.lineTo(tx,by+h+6);ctx.lineTo(tx+5,by+h-1);ctx.fillStyle='rgba(255,255,255,.96)';ctx.fill();
  ctx.fillStyle='#14202e';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,bx+w/2,by+h/2+0.5);
}
function glow(p,col,r){const c=toCamP(p);if(c[2]<NEAR)return;const s=projC(c),rr2=r*cam.F/c[2]*1.6;const g=ctx.createRadialGradient(s[0],s[1],0,s[0],s[1],rr2);
  g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(s[0],s[1],rr2,0,TAU);ctx.fill();}
function tag(p,text,col,dx){const c=toCamP(p);if(c[2]<NEAR)return;const s=projC(c);ctx.font='800 11px system-ui,sans-serif';
  const w=ctx.measureText(text).width+10,x=s[0]+dx-(dx<0?w:0),y=s[1]-9;
  ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(s[0],s[1]);ctx.lineTo(dx<0?x+w:x,y+9);ctx.stroke();
  rr(x,y,w,18,6);ctx.fillStyle=col;ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,x+w/2,y+9.5);}
function dashed(a,b,col){const s=seg2(a,b);if(!s)return;ctx.save();ctx.setLineDash([7,6]);ctx.strokeStyle=col;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(s[0][0],s[0][1]);ctx.lineTo(s[1][0],s[1][1]);ctx.stroke();ctx.restore();
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(s[1][0],s[1][1],4,0,TAU);ctx.fill();}
function fxDraw(f,t,bodies){
  const age=t-f.t0;let p;
  if(typeof f.at==='string'){const b=bodies[f.at];if(!b)return;p=[b.top[0],b.top[1]+1,b.top[2]];}else p=[f.at[0],f.y||5,f.at[1]];
  const c=toCamP([p[0],p[1]+age*1.2,p[2]]);if(c[2]<NEAR)return;const s=projC(c),k=backOut(ramp(age,0,0.3));
  ctx.save();ctx.globalAlpha=1-ramp(t,f.t1-0.35,f.t1);ctx.font=`900 ${Math.max(1,Math.round((f.size||22)*k))}px system-ui,-apple-system,sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='rgba(8,14,22,.85)';
  const hw=ctx.measureText(f.text).width/2+6,x=clamp(s[0],hw,Math.max(hw,W-hw)),y=clamp(s[1],18,H-18);ctx.strokeText(f.text,x,y);ctx.fillStyle=f.c||'#ffd23f';ctx.fillText(f.text,x,y);ctx.restore();}
function render(){
  const D=CUR,t=S.t;
  setCam(typeof D.cam==='function'?D.cam(t):D.cam);
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1a2838');bg.addColorStop(1,'#0a1018');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  drawWalls(false);drawIce();
  const objs=[];
  // flat + 3D props
  for(const p of D.props){
    if(p.t0!=null&&t<p.t0)continue;if(p.t1!=null&&t>=p.t1)continue;
    const sc=p.t0!=null?backOut(ramp(t,p.t0,p.t0+0.45)):1;
    if(p.type==='cone'){const at=typeof p.at==='function'?p.at(t):p.at;if(at)pushObj(objs,at[0],0.6,at[1],()=>drawCone(at[0],at[1],sc));}
    else if(p.type==='gate'){const g=gateCones(p.g),n=dirA(p.g.a*PI/180+PI/2),o=mul(n,0.35*sc);
      fillPoly([[g[0][0]+o[0],0,g[0][1]+o[1]],[g[1][0]+o[0],0,g[1][1]+o[1]],[g[1][0]-o[0],0,g[1][1]-o[1]],[g[0][0]-o[0],0,g[0][1]-o[1]]],'rgba(60,180,100,.6)');
      for(const c of g)pushObj(objs,c[0],0.6,c[1],()=>drawCone(c[0],c[1],sc));}
    else if(p.type==='tire')pushObj(objs,p.at[0],0.4,p.at[1],()=>drawTire(p.at[0],p.at[1],sc));
    else if(p.type==='pile')pushObj(objs,p.at[0],0.2,p.at[1],()=>{for(const[dx,dz,y]of[[0,0,0],[0.9,0.4,0],[-0.5,0.9,0],[0.3,0.4,0.24]])drawPuck(p.at[0]+dx,y,p.at[1]+dz);});
    else if(p.type==='conepile')pushObj(objs,p.at[0],0.6,p.at[1],()=>{drawCone(p.at[0],p.at[1],sc);drawCone(p.at[0],p.at[1],sc,0.3*sc);drawCone(p.at[0],p.at[1],sc,0.6*sc);drawCone(p.at[0]+1.4,p.at[1],sc*0.9);});
    else if(p.type==='stick'){const L=(p.len||5)/2,d=dirA(p.a),a=[p.at[0]-d[0]*L,0.05,p.at[1]-d[1]*L],b=[p.at[0]+d[0]*L,0.05,p.at[1]+d[1]*L];
      ctx.globalAlpha=clamp(sc,0,1);line3(a,b,0.16,'#9a6f35',2);line3(a,b,0.11,STICK,1.5);line3(b,[b[0]+d[1]*0.9,0.05,b[2]-d[0]*0.9],0.26,'#1d1d1f',2);ctx.globalAlpha=1;}
    else if(p.type==='ball'){const v=typeof p.at==='function'?p.at(t):p.at;if(v)pushObj(objs,v[0],v[1]+0.4,v[2],()=>drawBall(v[0],v[1],v[2],p.col));}
    else if(p.type==='hurdle'){for(let z=p.z0;z<p.z1-0.01;z+=4){const za=z,zb=Math.min(p.z1,z+4);pushObj(objs,p.x,0.5,(za+zb)/2,()=>drawHurdle(p.x,za,zb));}}
    else if(p.type==='pad'){const h=(p.size||3)/2;fillPoly([[p.at[0]-h,0.01,p.at[1]-h],[p.at[0]+h,0.01,p.at[1]-h],[p.at[0]+h,0.01,p.at[1]+h],[p.at[0]-h,0.01,p.at[1]+h]],p.col);}
    else if(p.type==='route')drawRoute(p.pts,p.col,typeof p.alpha==='function'?p.alpha(t):(p.alpha||0.8),p.arrow);
    else if(p.type==='seg'){const k=ramp(t,p.t0,p.t0+0.4),a=[p.a[0],0.08,p.a[1]],b=[lerp(p.a[0],p.b[0],k),0.08,lerp(p.a[1],p.b[1],k)];
      ctx.globalAlpha=0.35+0.15*Math.sin(t*8);line3(a,b,1.8,p.col);ctx.globalAlpha=1;line3(a,b,0.6,p.col);}
    else if(p.type==='divider'){const x=typeof p.x==='function'?p.x(t):p.x;for(let z=-42.5;z<42.4;z+=8.5){const z0=z,z1=Math.min(42.5,z+8.5);pushObj(objs,x,0.9,(z0+z1)/2,()=>drawDivider(x,z0,z1));}}
  }
  for(const n of(D.nets||[{x:89,z:0,a:PI},{x:-89,z:0,a:0}])){const f=dirA(n.a);pushObj(objs,n.x-f[0]*1.7,2,n.z-f[1]*1.7,()=>drawNetAt(n.x,n.z,n.a));}
  // actors
  const acts=[],bodies={};
  for(const a of D.actors){const s=evalActor(a,t);if(!s.hidden)acts.push(s);}
  for(const s of acts){const b=buildBody(s,t);bodies[s.id]=b;
    fillPoly(circ(s.x,s.z,1.25*b.S,0.01,14),'rgba(15,35,55,.18)');
    if(s.footRing)for(const f of b.feet)fillRing(circ(f[0],f[2],0.85,0.02,16),circ(f[0],f[2],0.55,0.02,16),'#ffc928');
    if(s.weightFoot!=null){const f=b.feet[s.weightFoot];fillRing(circ(f[0],f[2],1.05,0.02,18),circ(f[0],f[2],0.62,0.02,18),'#ffc928');}
    if(s.box){const{P}=frame(s),q=[P(1.25,-1.55,0),P(2.95,-1.55,0),P(2.95,0.15,0),P(1.25,0.15,0)].map(p=>[p[0],0.02,p[2]]),c=s.box==='good'?'47,191,113':s.box==='bad'?'229,72,77':'255,210,63';
      fillPoly(q,`rgba(${c},.3)`,`rgba(${c},.95)`,2);}
    pushObj(objs,s.x,2,s.z,()=>drawPrims(b.pr));
    if(s.puck){const pk=stickGeom(s,t).puck;pushObj(objs,pk[0],0.1,pk[1],()=>drawPuck(pk[0],0,pk[1]));}}
  // pucks + trails
  for(const pf of D.pucks){const p=pf(t);if(!p)continue;const q=pf(t-0.24);
    if(q&&Math.hypot(p[0]-q[0],p[2]-q[2])>2.5){let prev=q;for(let k=5;k>=0;k--){const r=pf(t-0.04*k);if(!r)continue;ctx.globalAlpha=0.5*(1-k/6);line3([prev[0],0.03,prev[2]],[r[0],0.03,r[2]],0.35,'#1d2c3c');prev=r;}ctx.globalAlpha=1;}
    pushObj(objs,p[0],p[1]+0.1,p[2],()=>drawPuck(p[0],p[1],p[2]));}
  objs.sort((a,b)=>b.d-a.d);for(const o of objs)o.fn();
  drawWalls(true);
  // overlays
  for(const s of acts){const b=bodies[s.id];
    if(s.handGlow&&b.topHand){glow(b.topHand,'rgba(70,220,120,.75)',0.5);glow(b.botHand,'rgba(255,205,50,.75)',0.5);}
    if(s.handTags&&b.topHand){tag(b.topHand,'TIGHT','#1e9e57',26);tag(b.botHand,'loose','#c98a00',-26);}
    if(s.sightTo&&bodies[s.sightTo])dashed(b.head,bodies[s.sightTo].head,'#ffd23f');
    if(s.sightPt)dashed(b.head,[s.sightPt[0],0.8,s.sightPt[1]],'#ffd23f');
    if(s.bladeTags&&b.heelW){tag(b.heelW,'HEEL','#c2410c',-30);tag(b.toeW,'TOE','#1e9e57',30);}
    if(s.aimPt&&b.toeW)dashed(b.toeW,[s.aimPt[0],0.5,s.aimPt[1]],'#ffd23f');
    if(s.balance){const m=[(b.feet[0][0]+b.feet[1][0])/2,0,(b.feet[0][2]+b.feet[1][2])/2];dashed(b.head,m,s.balance);}}
  for(const s of acts){if(!s.label)continue;const c=toCamP(bodies[s.id].top);if(c[2]<NEAR)continue;const p=projC(c);bubble(p[0],p[1],s.label,(TEAM[s.team]||TEAM.red).jersey);}
  for(const f of D.fx)if(t>=f.t0&&t<f.t1)fxDraw(f,t,bodies);
}

// ===== state & UI =====
const DRILLS=[dTTT(),dWall(),dCourse(),dAngle(),dWrist()].map(d=>{d.byId={};d.actors.forEach(a=>d.byId[a.id]=a);d.T=d.steps[d.steps.length-1].t1;d.pucks=d.pucks||[];d.fx=d.fx||[];d.props=d.props||[];return d;});
const S={di:0,t:0,si:0,playing:false,stopAt:0,speed:1,auto:false};
const $=id=>document.getElementById(id);
const ICON={play:'<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>'};
function buildTabs(){$('tabs').innerHTML='';DRILLS.forEach((d,i)=>{const b=document.createElement('button');b.className='tab'+(i===S.di?' on':'');b.innerHTML=`<b>${i+1}</b>${d.short||d.name}`;b.onclick=()=>selectDrill(i);$('tabs').appendChild(b);});}
function buildProgress(){const p=$('progress');p.innerHTML='';CUR.steps.forEach((s,i)=>{const b=document.createElement('button');b.className='seg';b.style.flex=String(s.t1-s.t0);b.title=s.title;b.setAttribute('aria-label','Step '+(i+1)+': '+s.title);b.innerHTML='<i></i>';b.onclick=()=>goStep(i,true);p.appendChild(b);});}
function fillDrill(){const d=CUR;$('drillName').textContent=d.name;$('drillMeta').textContent=d.meta;$('drillBig').textContent=d.big;
  $('drillRules').innerHTML=d.rules.map(r=>`<li>${r}</li>`).join('');$('drillNote').textContent=d.note||'';$('hudMeta').textContent=d.meta;$('score').hidden=!d.score;}
function updStep(){const st=CUR.steps[S.si];$('stepNo').textContent=`Step ${S.si+1} of ${CUR.steps.length}`;$('hudStep').textContent=`${S.si+1}/${CUR.steps.length} · ${st.title}${st.rate&&st.rate<1?' · slow-mo':''}`;
  $('stepTitle').textContent=st.title;$('stepText').textContent=st.text;$('stepCoach').innerHTML=st.coach?`<b>Coach version:</b> ${st.coach}`:'';updBtns();}
function updBtns(){$('bPlay').innerHTML=S.playing?ICON.pause:ICON.play;const st=CUR.steps[S.si];
  $('bNext').classList.toggle('pulse',!S.playing&&S.t>=st.t1-0.02&&S.si<CUR.steps.length-1);$('bAuto').textContent=S.auto?'All':'Step';$('bSpeed').textContent=S.speed+'×';}
function selectDrill(i){S.di=i;CUR=DRILLS[i];view.yaw=view.pitch=0;view.zoom=1;buildTabs();buildProgress();fillDrill();goStep(0,true);
  const tb=$('tabs').children[i];if(tb&&tb.scrollIntoView)tb.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});}
function goStep(i,play){const st=CUR.steps;S.si=clamp(i,0,st.length-1);S.t=st[S.si].t0;S.playing=!!play;S.stopAt=S.auto?CUR.T:st[S.si].t1;updStep();}
function togglePlay(){const st=CUR.steps;if(S.playing){S.playing=false;updBtns();return;}
  if(S.t>=st[S.si].t1-0.02){goStep(S.si<st.length-1?S.si+1:0,true);return;}
  S.playing=true;S.stopAt=S.auto?CUR.T:st[S.si].t1;updBtns();}
function tick(dt){if(!S.playing)return;const st=CUR.steps;S.t+=dt*S.speed*(st[S.si].rate||1);
  if(S.t>=S.stopAt){S.t=S.stopAt;S.playing=false;}
  while(S.auto&&S.si<st.length-1&&S.t>=st[S.si].t1&&S.t<CUR.T){S.si++;updStep();}
  if(!S.playing)updBtns();}
function updProgress(){const segs=$('progress').children;CUR.steps.forEach((s,i)=>{const f=i<S.si?1:i>S.si?0:ramp(S.t,s.t0,s.t1);segs[i].firstChild.style.width=(f*100).toFixed(1)+'%';});
  if(CUR.score){let b=0,r=0;for(const e of CUR.score)if(S.t>=e.t){e.team==='b'?b++:r++;}$('score').innerHTML=`<span class="b">Blue ${b}</span> – <span class="r">${r} Red</span>`;}
  const st=CUR.steps[S.si];$('bNext').classList.toggle('pulse',!S.playing&&S.t>=st.t1-0.02&&S.si<CUR.steps.length-1);}
let toastT=0;function toast(m){const e=$('toast');e.textContent=m;e.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>e.style.opacity=0,1100);}
$('bPlay').onclick=togglePlay;
$('bNext').onclick=()=>goStep(S.si+1,true);
$('bPrev').onclick=()=>goStep(S.t-CUR.steps[S.si].t0>0.8?S.si:S.si-1,true);
$('bReplay').onclick=()=>goStep(S.si,true);
$('bSpeed').onclick=()=>{S.speed=S.speed===1?0.5:S.speed===0.5?2:1;updBtns();toast('Speed '+S.speed+'×');};
$('bAuto').onclick=()=>{S.auto=!S.auto;S.stopAt=S.auto?CUR.T:CUR.steps[S.si].t1;updBtns();toast(S.auto?'Play the whole drill':'Stop after each step');};
$('bCam').onclick=()=>{view.mode=(view.mode+1)%MODES.length;view.pitch=0;toast(MODES[view.mode].n);};
const canSpeak='speechSynthesis' in window;if(!canSpeak)$('bSpeak').hidden=true;
$('bSpeak').onclick=()=>{if(!canSpeak)return;speechSynthesis.cancel();const st=CUR.steps[S.si];const u=new SpeechSynthesisUtterance(st.title+'. '+st.text);u.rate=0.95;u.pitch=1.1;speechSynthesis.speak(u);};
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&e.key===' ')return;if(e.key===' '){e.preventDefault();togglePlay();}else if(e.key==='ArrowRight')goStep(S.si+1,true);else if(e.key==='ArrowLeft')goStep(S.si-1,true);});
// camera interaction
const ptrs=new Map();let pinch0=0,lastTap=0;
const hideHint=()=>{$('hint').style.opacity=0;};setTimeout(hideHint,7000);
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});hideHint();
  const now=performance.now();if(now-lastTap<300&&ptrs.size===1){view.yaw=view.pitch=0;view.zoom=1;toast('View reset');}lastTap=now;});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){view.yaw-=dx*0.008;view.pitch=clamp(view.pitch+dy*0.005,-1.2,1.2);}
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0)view.zoom=clamp(view.zoom*pinch0/d,0.35,2.5);pinch0=d;}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();view.zoom=clamp(view.zoom*Math.exp(e.deltaY*0.001),0.35,2.5);hideHint();},{passive:false});
function resize(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
new ResizeObserver(resize).observe($('stage'));resize();
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;tick(dt);try{render();}catch(err){console.error(err);}updProgress();requestAnimationFrame(loop);}
selectDrill(0);requestAnimationFrame(loop);

})();
</script>
